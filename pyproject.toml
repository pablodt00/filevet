[project]
name = "filevet"
version = "0.0.2"
description = "Self-hosted scanner that inspects financial files for security risks before they are opened or ingested. Name reserved, under active development."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Pablo Durán" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
    "pydantic>=2",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/pablodt00/filevet"
Issues = "https://github.com/pablodt00/filevet/issues"

[project.scripts]
filevet = "filevet.interfaces.cli:main"

[project.entry-points."filevet.analyzers"]
"basic.type_mismatch" = "filevet.analyzers.basic.type_mismatch:TypeMismatch"

[dependency-groups]
dev = [
  "hypothesis>=6.170.15",
  "mypy>=2.4.1",
  "pre-commit>=4.7.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "pyyaml>=6.0.3",
  "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "filevet.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["requires_clamav: needs a running clamd at FILEVET_CLAMD"]
filterwarnings = ["ignore:This process .* is multi-threaded, use of fork:DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["filevet"]

[tool.coverage.report]
fail_under = 80
show_missing = true

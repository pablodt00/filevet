[project]
name = "filevet"
dynamic = ["version"]
description = "Self-hosted scanner that inspects financial files for security risks before they are opened or ingested. Name reserved, under active development."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Pablo Durán" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/pablodt00/filevet"
Issues = "https://github.com/pablodt00/filevet/issues"

[tool.hatch.version]
path = "src/filevet/__init__.py"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

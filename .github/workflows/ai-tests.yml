name: AI tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario ID from ai-tests/scenarios/, or all
        default: all

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: .claude/settings.json
          claude_args: --max-turns 80
          prompt: |
            /ai-test ${{ inputs.scenario || 'all' }}
            Don't commit, push or open a pull request. A later step in this workflow does that.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-test-reports
          path: ai-tests/reports/
          if-no-files-found: ignore
      - name: Open a PR with new regression cases
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ai-tests/run-${{ github.run_id }}
        run: |
          git add tests/corpus ai-tests/metrics.csv
          git diff --cached --quiet && exit 0
          git switch -c "$BRANCH"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "test: add regression cases from AI test run ${GITHUB_RUN_ID}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --head "$BRANCH" \
            --title "test: add regression cases from AI test run ${GITHUB_RUN_ID}" \
            --body "Regression cases and metrics from the [AI test run](${RUN_URL}). The reports are attached to the run as the ai-test-reports artifact."

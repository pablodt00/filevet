name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "src/filevet/analyzers/**"
      - "src/filevet/core/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: .claude/settings.json
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            filevet parses hostile files. Check the diff against the "Security rules" and
            "Conventions" sections of CLAUDE.md and against docs/threat-model.md.
            Skip style nits that ruff and mypy already catch.
            Post each issue as an inline comment on the line it concerns. If you find nothing,
            post one short comment saying so.
          claude_args: >
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff *),Bash(gh pr view *),Bash(gh pr comment *)"

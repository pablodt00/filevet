name: filevet
description: Scan the documents a pull request adds or changes and upload the findings to code scanning
branding:
  icon: shield
  color: blue

inputs:
  pattern:
    description: Extended regular expression for the paths to scan
    default: '\.(pdf|csv|txt|xml|xlsx|xlsm|xls|docx|docm|doc|zip)$'
  policy:
    description: Built-in policy name or path to a policy file
    default: default
  fail-on:
    description: Severity or verdict that fails the step
    default: block
  version:
    description: filevet version to install from PyPI
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    - id: scan
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        PATTERN: ${{ inputs.pattern }}
        POLICY: ${{ inputs.policy }}
        FAIL_ON: ${{ inputs.fail-on }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        sarif="$RUNNER_TEMP/filevet.sarif"
        git diff -z --name-only --diff-filter=ACMR "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed"
        files=()
        while IFS= read -r -d '' f; do
          [ -f "$f" ] && [ ! -L "$f" ] && files+=("$f")
        done < <(grep -zEi -- "$PATTERN" "$RUNNER_TEMP/changed" || true)
        if [ "${#files[@]}" -eq 0 ]; then
          echo "scanned=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        spec="filevet${VERSION:+==$VERSION}"
        status=0
        uvx --from "$spec" filevet scan --format sarif --output "$sarif" \
          --policy "$POLICY" --fail-on "$FAIL_ON" -- "${files[@]}" || status=$?
        echo "scanned=true" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
    - if: steps.scan.outputs.scanned == 'true'
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: filevet
    - if: steps.scan.outputs.scanned == 'true' && steps.scan.outputs.status != '0'
      shell: bash
      env:
        STATUS: ${{ steps.scan.outputs.status }}
      run: |
        echo "filevet exited with $STATUS"
        exit 1

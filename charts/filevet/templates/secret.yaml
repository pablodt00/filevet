{{- if not .Values.existingSecret }}
{{- $name := include "filevet.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $spool := .Values.spoolKey }}
{{- if and (not $spool) $existing }}
{{- $spool = index $existing.data "FILEVET_SPOOL_KEY" | b64dec }}
{{- end }}
{{- if not $spool }}
{{- $spool = randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "filevet.labels" . | nindent 4 }}
type: Opaque
stringData:
  FILEVET_API_KEYS: {{ required "set apiKeys or existingSecret" .Values.apiKeys | quote }}
  FILEVET_SPOOL_KEY: {{ $spool | quote }}
  {{- with .Values.webhook.secret }}
  FILEVET_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
